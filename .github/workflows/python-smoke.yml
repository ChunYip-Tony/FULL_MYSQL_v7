          assert 'ratio < Decimal("1.50")' in stock_src
          assert '"receipt_minus_selling_7d": receipt_qty - sold_d' in stock_src
          cal_src=inspect.getsource(backoffice_runtime.yipman_ordering_calendar)
          assert 'default_next=default_delivery+timedelta(days=7)' in cal_src
          assert 'strongest_weekday' in cal_src

          # Current cost cannot select a 109 observation as receipt valuation.
          assert "co.movement_type IN ('101','107')" in inspect.getsource(phase3._latest_cost)
          reconcile_src=inspect.getsource(quick_check_app.order_delivery_reconciliation)
          canonical_rows_src=inspect.getsource(quick_check_app._canonical_receipt_rows_for_line)
          relation_src=inspect.getsource(quick_check_app._quick_check_family_relationships)

name: python-smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Read production rebuild state
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          echo "=== HEALTH ==="
          curl -fsS --max-time 30 "$base/healthz"
          echo
          echo "=== ACTIVE ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/active"
          echo
          echo "=== RECENT ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/recent?limit=8"
          echo
          echo "=== 249527 ==="
          curl -fsS --max-time 90 "$base/v1/backoffice/inventory?category=ALL&limit=30&q=249527&lightweight=false"
          echo

name: python-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Import API
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import api; print(api.VERSION)"
      - name: Verify shared runtime version
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import api, v7_ingest; assert api.VERSION == v7_ingest.API_VERSION, (api.VERSION, v7_ingest.API_VERSION); print(api.VERSION)"
      - name: Validate 3 PM POS and MVT grace policy
        run: |
          python - <<'PY'
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          import business_clock as b

          tz=ZoneInfo('America/Los_Angeles')
          assert b.MVT_DAILY_GRACE_HOUR==15
          assert b.POS_DAILY_GRACE_HOUR==15
          for fn in (b.movement_expected_through_date,b.pos_expected_through_date):
              assert fn(datetime(2026,10,1,0,1,tzinfo=tz))==date(2026,9,29)
              assert fn(datetime(2026,10,1,14,59,59,tzinfo=tz))==date(2026,9,29)
              assert fn(datetime(2026,10,1,15,0,0,tzinfo=tz))==date(2026,9,30)
              assert fn(datetime(2026,10,1,23,59,tzinfo=tz))==date(2026,9,30)

          inv=open('inventory_position.py',encoding='utf-8').read()
          dc=open('data_coverage.py',encoding='utf-8').read()
          assert 'movement_expected_through_date()' in inv
          assert "source_type == 'sales_by_price_type'" in dc and 'pos_expected_through_date()' in dc
          assert "source_type == 'movement'" in dc and 'movement_expected_through_date()' in dc
          assert "'POS': daily_cell(p, pos_required)" in dc
          assert "'MVT': daily_cell(m, mvt_required)" in dc
          print('pos-mvt-3pm-grace=PASS')
          PY

      - name: Verify daily MVT close-file contract
        run: |
          python - <<'PY'
          from datetime import date
          from movement_coverage_rules import movement_daily_close_filename_evidence

          d=date(2026,9,27)
          def check(name,time,start=d,end=d,expected=False):
              ok,reason=movement_daily_close_filename_evidence(
                  original_filename=name,
                  filename_date_candidate=d,
                  filename_time_candidate=time,
                  coverage_start_date=start,
                  coverage_end_date=end,
                  business_date=d,
              )
              assert ok is expected, (name,time,start,end,ok,reason)
              return reason

          assert check('sf-mvt-092726.xls',None,expected=True) == 'COMPLETE_DATE_ONLY_MVT_FILENAME_CONTRACT'
          assert check('sf-mvt-092726-full.xls',None,expected=True) == 'COMPLETE_EXPLICIT_FULL_FILENAME'
          check('sf-mvt-092726-1630.xls','16:30:00',expected=False)
          check('mvt-092726-1521.xls','15:21:00',expected=False)
          check('sf-mvt-092726.xls',None,start=date(2026,9,26),end=d,expected=False)
          print('mvt-close-contract-ok')
          PY

      - name: Validate Ordering and Pricing no-grace best-available policy
        run: |
          python - <<'PY'
          import inspect
          import backoffice_runtime as b

          order_sig=inspect.signature(b.ordering_review)
          cached_sig=inspect.signature(b.cached_ordering_review)
          pricing_sig=inspect.signature(b.pricing_review)
          health_sig=inspect.signature(b._pricing_review_data_health)

          assert order_sig.parameters['best_available_delivery_evidence'].default is True
          assert cached_sig.parameters['best_available_delivery_evidence'].default is True
          assert pricing_sig.parameters['allow_stale_estimate'].default is True
          assert health_sig.parameters['allow_stale_estimate'].default is True

          order_src=inspect.getsource(b.ordering_review)
          assert 'source_limit=60' in order_src
          assert 'can_estimate=pos_through is not None and mvt_through is not None' in order_src
          assert 'up_to=mvt_through' in order_src
          assert 'forecast_start_date=mvt_through+timedelta(days=1)' in order_src
          assert 'common_dates=' not in order_src
          assert 'requires_common_pos_mvt_date":False' in order_src
          assert 'missing_dates_block_suggestions":False' in order_src

          price_src=inspect.getsource(b._pricing_review_data_health)
          assert 'BEST_AVAILABLE_INDEPENDENT_POS_MVT_NO_FRESHNESS_GATE' in price_src
          assert 'common_dates' not in price_src
          assert 'data_through = expected_through if current else pos_through' in price_src

          home_src=inspect.getsource(b._build_backoffice_home_summary)
          assert '{"CURRENT","STALE_ESTIMATE_AVAILABLE"}' in home_src
          cache_src=inspect.getsource(b._ordering_review_cache_key)
          assert 'V19_RECEIVING_PACK' in cache_src
          assert hasattr(b,'_historical_receiving_article_summary')
          assert hasattr(b,'_article_manual_family_pack_context')

          # Delivery-date Ordering must retain observed families, including
          # sufficient-stock rows, and may relax ONLY a missing-MVT-day gap.
          import webapp_v2_runtime as v2
          bulk_sig=inspect.signature(v2.bulk_ordering_suggestions)
          assert bulk_sig.parameters['include_sufficient_stock'].default is False
          assert bulk_sig.parameters['family_ids'].default is None
          oh_src=inspect.getsource(v2._family_effective_oh_for_ordering)
          assert 'blockers!={"MOVEMENT_DAILY_COVERAGE_GAP"}' in oh_src
          assert 'BEST_AVAILABLE_OH_TO_LATEST_CANONICAL_MVT' in oh_src
          family_sales_src=inspect.getsource(v2._family_sales_series)
          assert 'EXPLICIT_POS_SELLING_TO_COMMON_BASE_UOM' in family_sales_src
          assert 'base_qty_per_selling_unit' in family_sales_src
          assert 'MIXED_ACTIVE_SELLING_UOM_WITHOUT_COMMON_BASE_CONVERSION' in family_sales_src
          family_mvt_src=inspect.getsource(v2._ordering_family_movement_7d)
          assert 'FAMILY_251_MINUS_252_CANONICAL_COMPLETED_MVT_DAYS' in family_mvt_src
          family_mvt_history_src=inspect.getsource(v2._ordering_family_movement_metrics)
          assert 'family_movement_observation' in family_mvt_history_src
          assert 'file_id=%s AND posting_date=%s' in family_mvt_history_src
          bulk_src=inspect.getsource(v2.bulk_ordering_suggestions)
          assert 'FAMILY_251_252_7D' in bulk_src
          assert 'FAMILY_251_252_28D_FALLBACK' in bulk_src
          assert 'UPC_POS_FALLBACK' in bulk_src

          # Global upload-health grace still exists, but it is not a suggestion gate.
          import business_clock as clock
          assert clock.MVT_DAILY_GRACE_HOUR==15
          assert clock.POS_DAILY_GRACE_HOUR==15
          print('ordering-pricing-no-grace-best-available=PASS')
          PY


      - name: Validate Yipman Promotion Ordering contract
        run: |
          python - <<'PY'
          from datetime import date
          import inspect
          import promotion_ordering as p
          import webapp_v2_runtime as v2
          from pathlib import Path

          # Store rule: Weekly = Thu through following Thu inclusive (8 days);
          # Weekend = Fri through Sun inclusive (3 days).
          assert v2._promotion_type(date(2026,10,1),date(2026,10,8)) == 'WEEKLY'
          assert v2._promotion_type(date(2026,10,2),date(2026,10,4)) == 'WEEKEND'
          assert v2._promotion_type(date(2026,10,1),date(2026,10,9)) == 'OTHER'
          p._validate_window('WEEKLY',date(2026,10,1),date(2026,10,8))
          p._validate_window('WEEKEND',date(2026,10,2),date(2026,10,4))

          runtime=Path('webapp_v2_runtime.py').read_text(encoding='utf-8')
          # Regression guard: there must be exactly ONE active production engine.
          assert runtime.count('def bulk_ordering_suggestions(')==1
          sig=inspect.signature(v2.bulk_ordering_suggestions)
          assert 'next_delivery_date' in sig.parameters
          assert 'temporary_oh_overrides' in sig.parameters
          active_bulk=inspect.getsource(v2.bulk_ordering_suggestions)
          assert 'WEBAPP_V2_BULK_ORDERING_V6_UNIFIED' in active_bulk
          assert 'temporary_oh_overrides' in runtime
          assert 'REQUEST_ONLY_NOT_SAVED' in runtime
          assert 'promotion_start_date") or promotion_start_date' in runtime
          assert 'forecast_promotion_coverage' in runtime
          assert 'forecast_regular_coverage' in runtime
          assert 'coverage_usage-usable_at_delivery' in active_bulk
          assert 'pre_delivery_stockout_qty=max' in active_bulk
          assert 'TEMPORARY_OH_ONLY_FOR_PROMOTION_ORDERING' in active_bulk

          promo=Path('promotion_ordering.py').read_text(encoding='utf-8')
          assert 'temporary_oh_persisted":False' in promo
          assert 'yipman_promotion_list' in promo
          assert 'PROMOTION_IMPORT_SUPPORTS_CSV_XLS_XLSX' in promo

          api=Path('api.py').read_text(encoding='utf-8')
          assert "/v1/yipman/promotion-lists/import" in api
          assert "/v1/yipman/promotion-ordering/calculate" in api

          ui=Path('yipman_ui.py').read_text(encoding='utf-8')

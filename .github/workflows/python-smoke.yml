      - name: Validate controlled pricing path, freshness tests, and compact progress UI
        run: |
          python - <<'PY'
          import inspect
          from decimal import Decimal
          from pathlib import Path
          import webapp_v2_runtime as v2

          src=inspect.getsource(v2.performance_report)
          assert v2._retail_price_point(Decimal('9.71'))==Decimal('9.69')
          assert v2._retail_price_point(Decimal('4.64'))==Decimal('4.59')
          assert v2._retail_price_point(Decimal('3.54'))==Decimal('3.49')
          assert v2._retail_price_point(Decimal('2.54'))==Decimal('2.49')
          assert v2._retail_price_point(Decimal('17.09'))==Decimal('16.99')
          assert v2._retail_price_point(Decimal('9.71'),min_price=Decimal('9.70'))==Decimal('9.79')
          from backoffice_runtime import (
              MIN_TEST_PRICE_STEP,
              _freshness_velocity_target,
              _next_testing_price,
              _tested_testing_prices,
              pricing_review,
          )
          path=_tested_testing_prices(
              current='8.99',
              tested='9.71',
              target='11.39',
              observed_candidates=None,
          )
          assert MIN_TEST_PRICE_STEP==Decimal('0.45')
          assert path['testing_anchor_price']==Decimal('8.99')
          assert path['tested_evidence_price']==Decimal('9.71')
          assert path['tested_price']==Decimal('9.69')
          assert path['target_sweet_spot_price']==Decimal('11.29')
          assert path['testing_price']==Decimal('9.49')
          assert path['testing_price']-path['testing_anchor_price']>=Decimal('0.45')
          assert str(path['testing_price'])[-2:] in {'29','49','59','69','79','99'}

          # Do not publish a Testing price too close to Current.
          assert _next_testing_price(Decimal('8.99'),Decimal('9.29')) is None
          assert _next_testing_price(Decimal('8.99'),Decimal('8.69')) is None

          # Low-price items still move at least $0.45 in either direction.
          assert _next_testing_price(Decimal('3.99'),Decimal('5.00'))==Decimal('4.49')
          assert _next_testing_price(Decimal('3.99'),Decimal('2.99'))==Decimal('3.49')

          # Too-close observed prices are skipped; the next meaningful observed
          # point is used when it fits the gradual cap.
          assert _next_testing_price(
              Decimal('8.99'),
              Decimal('10.00'),
              [{'price':Decimal('9.19')},{'price':Decimal('9.44')}],
          )==Decimal('9.49')

          fresh_target=_freshness_velocity_target(
              current='8.99',
              current_cost='6.00',
              current_velocity='0.50',
              company_low='7.00',
              company_high='10.00',
              observed_candidates=[{
                  'price':Decimal('8.49'),
                  'observed_velocity_per_day':Decimal('1.10'),
                  'gp_per_observed_day_at_current_cost':Decimal('2.20'),
              }],
          )
          assert fresh_target==Decimal('8.49')

          review_src=inspect.getsource(pricing_review)
          assert 'reason_code = "VELOCITY_TEST"' in review_src
          assert 'reason_code = "SWEET_SPOT_GAP"' in review_src
          assert 'reason_code = "GP_DOLLAR_TEST"' in review_src
          assert 'reason_code = "COMPANY_RANGE"' in review_src
          assert 'RETAIL_ALIGNED_STRONGEST_PROVED_HISTORICAL_SWEET_SPOT' in review_src
          assert 'current_price_gp_pct' in review_src
          assert 'tested_price_gp_pct' in review_src
          assert 'testing_price_gp_pct' in review_src
          assert 'V4_REG_TPR_SPLIT' in inspect.getsource(__import__('backoffice_runtime')._pricing_review_cache_key)

          assert 'if not has_oh or not history_gate:' in src
          assert 'FRESHNESS_SELL_THROUGH_WATCH_DOH_5_TO_7' in src
          assert 'outside_company_range' in src
          assert 'freshness_velocity_test' in src
          assert 'positive_gp_day_test' in src
          assert 'DOH_IS_URGENCY_NOT_ELIGIBILITY' in src
          assert 'POSITIVE_OH_AND_28D_SALES_HISTORY_FOR_ALL_CLASSES' in src
          assert 'WEBAPP_V2_PERFORMANCE_V13_COMPACT_PRICE_PROGRESS' in src

          ui=Path('yipman_ui.py').read_text(encoding='utf-8')
          assert "setPath('[data-q-testing]',row.testing_price,pricingWarming?'…':'None')" in ui
          assert "setPath('[data-q-tested]',row.tested_price,'Not set')" in ui
          assert '.qprice b.qempty' in ui
          assert 'IGNORE 12 HOURS' in ui
          assert 'priceIgnoredThisVisit.has(id)' in ui
          assert 'PRICE_IGNORE_MS=12*60*60*1000' in ui
          assert '.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden' in ui

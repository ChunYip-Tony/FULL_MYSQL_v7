      - name: Validate canonical physical receipt semantics
        run: |
          python - <<'PY'
          import inspect
          from decimal import Decimal
          import phase3
          import backoffice_runtime
          import webapp_v2_runtime
          import quick_check_app
          from receipt_semantics import (
              physical_receipt_stage_rows,
              is_physical_receipt_movement,
              is_positive_physical_receipt_movement,
              is_receipt_cost_movement,
          )

          # Same-day 107 + 109 is ONE delivery: quantity comes from 109 only.
          same_day=[
              {'movement_type':'107','posting_date':'2026-09-22','base_quantity':Decimal('132.276')},
              {'movement_type':'109','posting_date':'2026-09-22','base_quantity':Decimal('132.276')},
          ]
          chosen,basis=physical_receipt_stage_rows(same_day)
          assert [x['movement_type'] for x in chosen] == ['109'], (chosen,basis)
          assert sum(x['base_quantity'] for x in chosen) == Decimal('132.276')

          # Cross-date 107 + 109 is still ONE delivery. A 107-only day contributes

name: python-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Import API
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import api; print(api.VERSION)"
      - name: Verify shared runtime version
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import api, v7_ingest; assert api.VERSION == v7_ingest.API_VERSION, (api.VERSION, v7_ingest.API_VERSION); print(api.VERSION)"
      - name: Verify daily MVT close-file contract
        run: |
          python - <<'PY'
          from datetime import date
          from movement_coverage_rules import movement_daily_close_filename_evidence

          d=date(2026,9,27)
          def check(name,time,start=d,end=d,expected=False):
              ok,reason=movement_daily_close_filename_evidence(
                  original_filename=name,
                  filename_date_candidate=d,
                  filename_time_candidate=time,
                  coverage_start_date=start,
                  coverage_end_date=end,
                  business_date=d,
              )
              assert ok is expected, (name,time,start,end,ok,reason)
              return reason

          assert check('sf-mvt-092726.xls',None,expected=True) == 'COMPLETE_DATE_ONLY_MVT_FILENAME_CONTRACT'
          assert check('sf-mvt-092726-full.xls',None,expected=True) == 'COMPLETE_EXPLICIT_FULL_FILENAME'
          check('sf-mvt-092726-1630.xls','16:30:00',expected=False)
          check('mvt-092726-1521.xls','15:21:00',expected=False)
          check('sf-mvt-092726.xls',None,start=date(2026,9,26),end=d,expected=False)
          print('mvt-close-contract-ok')
          PY

      - name: Validate all-UPC source lineage normalization
        run: |
          python - <<'PY'
          import inspect
          import phase3
          import quick_check_app
          import webapp_v2_runtime
          import coverage_backfill
          from upc_aliases import (
              service_249_canonical_base,
              service_249_product_code,
              source_barcode_aliases,
              source_ean_predicate,
              normalize_selling_description,
              looks_like_249_service_description,
          )

          # 249 service lineage.
          assert service_249_product_code('249450') == '249450'
          assert service_249_product_code('24945012345') == '249450'
          assert service_249_canonical_base('24945012345') == '24945000000'

          # SAP selling Article structural lineage is exact and deterministic.
          assert phase3._structural_sap_selling_upc('1540569') == '24056900000'
          assert phase3._structural_sap_selling_upc('1545569') == '24556900000'
          assert phase3._structural_sap_selling_upc('1549569') == '24956900000'
          assert phase3._structural_sap_selling_upc('1547569') is None

          assert normalize_selling_description('MILK FISH(Fried Service)') == 'MILK FISH FRIED SERVICE'
          assert looks_like_249_service_description('MILK FISH(Fried Service)')
          assert not looks_like_249_service_description('MILK FISH')

          # Leading-zero and deterministic shortened retail-barcode lineage.
          pred,args=source_ean_predicate('s.ean_upc','4918')
          assert "TRIM(LEADING '0' FROM s.ean_upc)=%s" in pred and '4918' in args
          aliases=source_barcode_aliases('036000291452')
          assert '03600029145' in aliases
          assert '3600029145' in aliases

          # Full and targeted rebuilds must both carry raw EAN lineage.
          full=inspect.getsource(phase3.rebuild_quick_check)
          targeted=inspect.getsource(phase3.refresh_quick_check_subset)
          for src in (full,targeted):
              assert "_sales_metrics(cur, upc_id, pos_days_7, p['ean_upc'])" in src
              assert "_sales_metrics(cur, upc_id, pos_days_28, p['ean_upc'])" in src
              assert "_sales_metrics(cur, upc_id, pos_days_30, p['ean_upc'])" in src
              assert "_current_price(cur, upc_id, p['ean_upc'])" in src
              assert "_historical_sweet_spot(cur, upc_id, family_id, factor, pos_days_30, p['ean_upc'])" in src

          # Current price must query canonical + raw lineage together, never
          # wait for canonical evidence to be completely absent.
          price_src=inspect.getsource(phase3._current_price)
          assert '_lineage_pred("s.upc_id","s.ean_upc")' in price_src
          assert '_lineage_pred("p.upc_id","p.ean_upc")' in price_src
          assert 'if sold_date is None and ean' not in price_src

          # Every serving sales reader uses the same shared raw-source predicate.
          assert 'source_ean_predicate' in inspect.getsource(phase3._upc_match_sql)
          assert 'source_ean_predicate' in inspect.getsource(quick_check_app._sales_lineage_pred)
          assert 'source_ean_predicate' in inspect.getsource(webapp_v2_runtime._sales_lineage_pred)

          # 28D active/UOM/cost repair must resolve current canonical UPC from
          # raw EAN before trusting a stale derived upc_id.
          qty_src=inspect.getsource(coverage_backfill.canonical_pos_qty_by_upc)
          assert '_resolve_source_upc_id' in qty_src
          assert 'description' in qty_src
          assert 'GROUP BY ean_upc,upc_id,description' in qty_src
          pos_resolver=inspect.getsource(phase3._find_pos_upc_id)
          assert 'looks_like_249_service_description' in pos_resolver
          assert "su.ean_upc LIKE '249%'" in pos_resolver
          # Hybrid 249 rule: RAW POS / product-code identity is evaluated before
          # Article Manual fallback, and disagreement fails closed.
          assert pos_resolver.index('base_id=_find_upc_id') < pos_resolver.index('manual_id =')
          source_resolver=inspect.getsource(coverage_backfill._resolve_source_upc_id)
          assert source_resolver.index('if raw in exact') < source_resolver.index('manual_uid =')
          assert source_resolver.index('service_249_canonical_base') < source_resolver.index('manual_uid =')
          assert 'int(manual_uid) != int(raw_uid)' in source_resolver
          assert phase3._department_from_pos_section('400') == '400'
          assert phase3._department_from_pos_section('401') == '400'
          assert '_department_from_pos_section(a)' in inspect.getsource(phase3._process_sales)
          history_relink=inspect.getsource(phase3.relink_history)
          assert '_find_pos_upc_id' in history_relink
          assert "COALESCE(description,'')" in history_relink
          assert "_structural_sap_selling_family" in inspect.getsource(phase3._find_article)
          assert "family_movement_observation" in history_relink
          assert "154[059]" in history_relink
          active_guard=inspect.getsource(phase3.rebuild_current_active_unmapped_sales_guard)
          assert '_recent_pos_canonical_ids_for_raw_ean' in active_guard
          assert '_upc_id_identity_ready' in active_guard
          assert 'mapped_by_relinked_pos_upc_id_count' in active_guard
          relink_src=inspect.getsource(coverage_backfill.relink_pos_backfill)
          assert '_resolve_source_upc_id' in relink_src

          print('all-upc-lineage-smoke=PASS')
          PY


      - name: Diagnose production 249527 POS evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          echo "=== HEALTH ==="
          curl -fsS --max-time 30 "$base/healthz" || true
          echo
          echo "=== ACTIVE PIPELINE ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/active" || true
          echo
          echo "=== RECENT BATCHES ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/recent?limit=8" || true
          echo
          echo "=== 249527 SOURCE EVIDENCE ==="
          curl -fsS --max-time 120 "$base/v1/web-upload/diagnostics/249-source-evidence?upc=24952700000" || true
          echo
          echo "=== 249527 INVENTORY ==="
          curl -fsS --max-time 90 "$base/v1/backoffice/inventory?category=ALL&limit=30&q=249527&lightweight=false" || true
          echo

      - name: Diagnose current production upload state
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          echo "=== HEALTH ==="
          curl -fsS --max-time 30 "$base/healthz" || true
          echo
          echo "=== ACTIVE ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/active" || true
          echo
          echo "=== RECENT ==="
          curl -fsS --max-time 60 "$base/v1/web-upload/recent?limit=8" || true
          echo
          echo "=== BATCH 22 ==="
          curl -fsS --max-time 60 "$base/v1/web-upload/diagnostics/batch-id/22" || true
          echo

      - name: Validate Backoffice DOM collection bindings
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('backoffice_ui.py').read_text(encoding='utf-8')
          bad = re.findall(
              r"(?<!\$)\$\([^)]*\)\.(?:forEach|map|filter|find|some|every|reduce)\b",
              text,
          )
          assert not bad, f"Single-element $() used as collection: {bad}"
          print('backoffice-dom-bindings=PASS')
          PY

      - name: Validate live mobile batch progress contract
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          import phase3, worker, v7_ingest

          ui=Path('backoffice_ui.py').read_text(encoding='utf-8')
          p3=inspect.getsource(phase3.rebuild_quick_check)
          touch=inspect.getsource(worker._touch_run)
          active=inspect.getsource(v7_ingest.find_active_batch)

          assert "'progress_kind': 'ROW_COUNT'" in p3
          assert "'progress_current': current" in p3
          assert "'progress_total': total_rows" in p3
          assert "current % 10" in p3 and "3.0" in p3
          assert "progress_payload" in touch
          assert "'progress_current_upc'" in touch
          assert "payload[key]=None" in touch
          assert "'active_files'" in active
          assert "'progress_issue_counts'" in active
          assert 'function batchPhaseStripHtml' in ui
          assert 'function mobileBatchIssueRowsHtml' in ui
          assert 'm-batch-progress-main' in ui
          assert 'mobile-batch-detail-active' in ui
          assert 'Current Errors / Issues' in ui
          print('mobile-batch-live-progress=PASS')
          PY

      - name: Validate Backoffice pricing and inventory contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('backoffice_runtime.py').read_text(encoding='utf-8')
          ui = Path('backoffice_ui.py').read_text(encoding='utf-8')
          assert 'QUICK_CHECK_CURRENT_AT_RESPONSE_TIME' in runtime
          assert 'upc_velocity_7d' in runtime
          assert 'vel7_oh_desc' in ui
          assert 'Highest 7D Velocity → Highest OH' in ui
          assert 'money(r.current_cost)' in ui
          assert 'FAMILY_251_252_ACTIVE' in runtime
          assert 'RECEIVING_AND_SAP_SELLING_ARTICLE' in runtime
          assert 'family_group_raw_movement_uom' in runtime
          assert 'Show inactive SAP Article' in ui
          assert 'PAIRED_SOURCE_317_318_NET_CONVERTED_OUT' in runtime
          assert 'family_conversion_317_318_7d' in runtime
          assert 'movement_by_article.get((fid, art), {})' in runtime
          assert 'SUM_LINKED_RECEIVING_ARTICLE_251_MINUS_252_WHEN_BASE_UOM_MATCHES' not in runtime

          # Article Manual/Table 1 owns operational hierarchy. For Fresh/Live/
          # Shrimp/Fish Ball/Frozen Fish: A=Family/Main, B=Selling Article,
          # C=Toledo, D=EAN/UPC, G=receiving pack size. Frozen Pack uses
          # A=Family, D=EAN/UPC, E=receiving pack size, G=Selling UOM.
          # 317/318 and 309 are lineage/conversion only, never added as sold usage.
          assert 'ARTICLE_MANUAL_COLUMN_B_TO_D_EXACT' in runtime
          assert 'SUM_UNIQUE_ALL_SELLING_ARTICLE_251_MINUS_252_IN_FAMILY' in runtime
          assert '"family_qty_7d": family_ctx.get("family_group_movement_7d")' in runtime
          assert '"family_qty_basis": "TOTAL_SELLING_MVT_COMPATIBILITY_ALIAS"' in runtime
          assert 'SUM_UNIQUE_TABLE1_SELLING_ARTICLE_251_MINUS_252_FOR_7D_POS_ACTIVE_UPCS' not in runtime
          assert 'all_selling_articles: set[str] = set()' in runtime
          assert 'for art in sorted(all_selling_articles)' in runtime
          assert 'SUM_UNIQUE_ASSIGNED_SELLING_ARTICLE_251_MINUS_252_FOR_7D_POS_ACTIVE_UPCS' not in runtime
          assert 'READY_TOTAL_SELLING_MVT_RECONCILED' in runtime
          assert 'ARTICLE_MANUAL_MAIN_ROW_COLUMN_G' not in runtime
          assert 'HOLD_SELLING_ARTICLE_MVT_UOM_NOT_MAIN_SELLING_UOM' not in runtime
          assert '7D TOTAL SELLING MVT' in ui
          assert 'TOTAL SELLING MVT RECONCILED' in ui
          assert 'RECONCILED' in ui
          assert 'Family Selling UOM' not in ui
          assert 'SAP MVT UOM' in ui
          assert '317/318 CONVERSION LINEAGE' in ui
          assert "Raw Article Manual is read directly" in runtime
          assert "fresh fish" in runtime and "frozen pack" in runtime
          assert "str(row.get(\"col_b\") or \"\").strip() or main" in runtime
          assert "manual_upc_override" in runtime
          assert 'USER_CONFIRMED_SELLING_ARTICLE_OVERRIDES_20260930' in runtime
          assert 'READY_ORPHAN_251_252_RESCUED_BY_UNIQUE_SELLING_LINEAGE' in runtime
          assert 'm.family_id IS NULL' in runtime
          assert 'FAMILY / SAP SELLING ARTICLE' not in ui
          assert 'Place its UPCs directly underneath' in ui
          assert '_fallback_selling_article_compatible' in runtime
          assert 'NO_PREFIX_COMPATIBLE_SAP_SELLING_ARTICLE' in runtime
          assert 'must never win heuristic UPC assignment' in runtime
          print('backoffice-pricing-inventory-contract=PASS')
          PY


      - name: Validate global Selling Article fallback guards
        run: |
          python - <<'PY'
          import backoffice_runtime as b

          ok=b._fallback_selling_article_compatible
          # Deterministic production bug class.
          assert not ok('240','1549739','NORWEGIAN SABA(Fried Service)')
          assert not ok('245','1549739','NORWEGIAN SABA(Fried Service)')
          assert not ok('240','1545739','NORWEGIAN SABA')
          assert not ok('245','1540739','NORWEGIAN SABA')
          assert ok('240','1540739','NORWEGIAN SABA')
          assert ok('245','1545739','NORWEGIAN SABA')

          # Generic FRIED in a product name is not the same as SERVICE.
          assert ok('245','3400184','FRIED ROE BALL')
          assert not ok('240','2000001','FISH SERVICE')
          assert not ok('245','2000001','FISH SERVICE')

          # 249 is intentionally not hard-restricted in fallback because valid
          # 317/318 service lineage can resolve to non-1549 SAP articles.
          assert ok('249','1540453','SEA BASS STEAK')
          assert ok('249','2012274','FRESH BIG MOUTH BASS')
          assert ok('249','2045590','30/40 H/O WHITE SHRIMP(Fried Service)')
          print('global-selling-article-fallback-guard=PASS')
          PY

      - name: Validate Article Manual tab schemas
        run: |
          python - <<'PY'
          import inspect
          from decimal import Decimal
          import normalize
          import article_manual_multitab_repair as amr
          import active_28d_uom_repair as a28

          fresh = normalize._article_manual_column_map('Fresh fish', {})
          assert fresh['main_article']=='A'
          assert fresh['article']=='B'
          assert fresh['sales_set']=='C'
          assert fresh['upc']=='D'
          assert fresh['pack']=='G'
          assert 'selling_uom' not in fresh

          frozen = normalize._article_manual_column_map('Frozen Pack', {})
          assert frozen['main_article']=='A'
          assert frozen['article']=='A'
          assert frozen['upc']=='D'
          assert frozen['pack']=='E'
          assert frozen['selling_uom']=='G'

          pi_frozen = normalize._monthly_pi_column_map('FROZEN', {})
          assert pi_frozen['pack']=='D'
          assert pi_frozen['base_uom']=='E'
          assert pi_frozen['main_article']=='G'
          assert pi_frozen['upc']=='H'
          assert pi_frozen.get('receiving_uom')!='E'

          pi_fl = normalize._monthly_pi_column_map('FRESH&LIVE', {})
          assert pi_fl['pack']=='D'
          assert pi_fl['order_uom']=='E'
          assert pi_fl['main_article']=='F'
          assert pi_fl.get('receiving_uom')!='E'
          assert pi_fl.get('base_uom')!='E'

          x=normalize._monthly_pi_pack_structure('60LB/CV','LB')
          assert x['base_uom']=='LB' and x['receiving_uom']=='CV'
          assert Decimal(str(x['base_qty_per_receiving_unit']))==Decimal('60')
          x=normalize._monthly_pi_pack_structure('40 LB/BAG','LB')
          assert x['base_uom']=='LB' and x['receiving_uom']=='BAG'
          assert Decimal(str(x['base_qty_per_receiving_unit']))==Decimal('40')
          x=normalize._monthly_pi_pack_structure('12 EA/CV','EA')
          assert x['base_uom']=='EA' and x['receiving_uom']=='CV'
          assert Decimal(str(x['base_qty_per_receiving_unit']))==Decimal('12')
          x=normalize._monthly_pi_pack_structure('5/2LB','CV')
          assert x['base_uom']=='LB' and x['receiving_uom']=='CV'
          assert Decimal(str(x['base_qty_per_receiving_unit']))==Decimal('10')
          x=normalize._monthly_pi_pack_structure('LB','LB')
          assert x['base_uom']=='LB' and x['receiving_uom']=='LB'
          assert Decimal(str(x['base_qty_per_receiving_unit']))==Decimal('1')
          x=normalize._monthly_pi_pack_structure('10LB','LB')
          assert x['base_uom']=='LB' and x['receiving_uom']=='LB'
          assert Decimal(str(x['base_qty_per_receiving_unit']))==Decimal('1')

          p65=normalize._structured_pack_weight('6/5LB')
          assert Decimal(str(p65['outer_count']))==Decimal('6')
          assert Decimal(str(p65['inner_qty']))==Decimal('5')
          assert Decimal(str(p65['total_base_qty']))==Decimal('30')
          assert Decimal(str(normalize._selling_factor_from_frozen_pack('BX','6/5LB')['base_qty_per_selling_unit']))==Decimal('5')
          assert Decimal(str(normalize._selling_factor_from_frozen_pack('CV','6/5LB')['base_qty_per_selling_unit']))==Decimal('30')

          a28src=inspect.getsource(a28.repair_active_28d_uom)
          assert 'ARTICLE_MANUAL_FROZEN_PACK_PLUS_MONTHLY_PI_BASE_V7303' in inspect.getsource(a28._safe_frozen_pack_cross_source_mapping)
          assert '# 0b) Strong two-source packaged-item authority:' in a28src
          assert 'cross = _safe_frozen_pack_cross_source_mapping' in a28src
          assert 'if _has_current_uom(cur, upc_id):' in a28src
          assert '_latest_monthly_pi_frozen_base_source' in a28src
          d=a28._parse_frozen_pack_selling_declaration('2LB/PACK','12/2LB')
          assert d['selling_uom']=='PACK' and d['declared_base_uom']=='LB'
          assert Decimal(str(d['base_qty_per_selling_unit']))==Decimal('2')
          d=a28._parse_frozen_pack_selling_declaration('PAC','15/1.5LB')
          assert d['selling_uom']=='PAC' and d['declared_base_uom']=='LB'
          assert Decimal(str(d['base_qty_per_selling_unit']))==Decimal('1.5')
          d=a28._parse_frozen_pack_selling_declaration('EA','5/2LB')
          assert d['selling_uom']=='EA' and d['declared_base_uom']=='LB'
          assert Decimal(str(d['base_qty_per_selling_unit']))==Decimal('2')

          nsrc=inspect.getsource(normalize._normalize_identity_row)
          assert 'ARTICLE_MANUAL_TOLEDO_EAN_LB' in nsrc
          assert "and ean_upc" in nsrc and "and sales_set" in nsrc
          rsrc=inspect.getsource(amr._load_roster)
          assert 'ARTICLE_MANUAL_TOLEDO_EAN_LB' in rsrc
          print('article-manual-tab-schema=PASS')
          PY


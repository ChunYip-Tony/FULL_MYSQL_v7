name: python-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Import API
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import api; print(api.VERSION)"
      - name: Verify shared runtime version
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import api, v7_ingest; assert api.VERSION == v7_ingest.API_VERSION, (api.VERSION, v7_ingest.API_VERSION); print(api.VERSION)"
      - name: Verify daily MVT close-file contract
        run: |
          python - <<'PY'
          from datetime import date
          from movement_coverage_rules import movement_daily_close_filename_evidence

          d=date(2026,9,27)
          def check(name,time,start=d,end=d,expected=False):
              ok,reason=movement_daily_close_filename_evidence(
                  original_filename=name,
                  filename_date_candidate=d,
                  filename_time_candidate=time,
                  coverage_start_date=start,
                  coverage_end_date=end,
                  business_date=d,
              )
              assert ok is expected, (name,time,start,end,ok,reason)
              return reason

          assert check('sf-mvt-092726.xls',None,expected=True) == 'COMPLETE_DATE_ONLY_MVT_FILENAME_CONTRACT'
          assert check('sf-mvt-092726-full.xls',None,expected=True) == 'COMPLETE_EXPLICIT_FULL_FILENAME'
          check('sf-mvt-092726-1630.xls','16:30:00',expected=False)
          check('mvt-092726-1521.xls','15:21:00',expected=False)
          check('sf-mvt-092726.xls',None,start=date(2026,9,26),end=d,expected=False)
          print('mvt-close-contract-ok')
          PY

      - name: Validate all-UPC source lineage normalization
        run: |
          python - <<'PY'
          import inspect
          import phase3
          import quick_check_app
          import webapp_v2_runtime
          import coverage_backfill
          from upc_aliases import (
              service_249_canonical_base,
              service_249_product_code,
              source_barcode_aliases,
              source_ean_predicate,
              normalize_selling_description,
              looks_like_249_service_description,
          )

          # 249 service lineage.
          assert service_249_product_code('249450') == '249450'
          assert service_249_product_code('24945012345') == '249450'
          assert service_249_canonical_base('24945012345') == '24945000000'

          # SAP selling Article structural lineage is exact and deterministic.
          assert phase3._structural_sap_selling_upc('1540569') == '24056900000'
          assert phase3._structural_sap_selling_upc('1545569') == '24556900000'
          assert phase3._structural_sap_selling_upc('1549569') == '24956900000'
          assert phase3._structural_sap_selling_upc('1547569') is None

          assert normalize_selling_description('MILK FISH(Fried Service)') == 'MILK FISH FRIED SERVICE'
          assert looks_like_249_service_description('MILK FISH(Fried Service)')
          assert not looks_like_249_service_description('MILK FISH')

          # Leading-zero and deterministic shortened retail-barcode lineage.
          pred,args=source_ean_predicate('s.ean_upc','4918')
          assert "TRIM(LEADING '0' FROM s.ean_upc)=%s" in pred and '4918' in args
          aliases=source_barcode_aliases('036000291452')
          assert '03600029145' in aliases
          assert '3600029145' in aliases

          # Full and targeted rebuilds must both carry raw EAN lineage.
          full=inspect.getsource(phase3.rebuild_quick_check)
          targeted=inspect.getsource(phase3.refresh_quick_check_subset)
          for src in (full,targeted):
              assert "_sales_metrics(cur, upc_id, pos_days_7, p['ean_upc'])" in src
              assert "_sales_metrics(cur, upc_id, pos_days_28, p['ean_upc'])" in src
              assert "_sales_metrics(cur, upc_id, pos_days_30, p['ean_upc'])" in src
              assert "_current_price(cur, upc_id, p['ean_upc'])" in src
              assert "_historical_sweet_spot(cur, upc_id, family_id, factor, pos_days_30, p['ean_upc'])" in src

          # Current price must query canonical + raw lineage together, never
          # wait for canonical evidence to be completely absent.
          price_src=inspect.getsource(phase3._current_price)
          assert '_lineage_pred("s.upc_id","s.ean_upc")' in price_src
          assert '_lineage_pred("p.upc_id","p.ean_upc")' in price_src
          assert 'if sold_date is None and ean' not in price_src

          # Every serving sales reader uses the same shared raw-source predicate.
          assert 'source_ean_predicate' in inspect.getsource(phase3._upc_match_sql)
          assert 'source_ean_predicate' in inspect.getsource(quick_check_app._sales_lineage_pred)
          assert 'source_ean_predicate' in inspect.getsource(webapp_v2_runtime._sales_lineage_pred)

          # 28D active/UOM/cost repair must resolve current canonical UPC from
          # raw EAN before trusting a stale derived upc_id.
          qty_src=inspect.getsource(coverage_backfill.canonical_pos_qty_by_upc)
          assert '_resolve_source_upc_id' in qty_src
          assert 'description' in qty_src
          assert 'GROUP BY ean_upc,upc_id,description' in qty_src
          pos_resolver=inspect.getsource(phase3._find_pos_upc_id)
          assert 'looks_like_249_service_description' in pos_resolver
          assert "su.ean_upc LIKE '249%'" in pos_resolver
          history_relink=inspect.getsource(phase3.relink_history)
          assert '_find_pos_upc_id' in history_relink
          assert "COALESCE(description,'')" in history_relink
          assert "_structural_sap_selling_family" in inspect.getsource(phase3._find_article)
          assert "family_movement_observation" in history_relink
          assert "154[059]" in history_relink
          active_guard=inspect.getsource(phase3.rebuild_current_active_unmapped_sales_guard)
          assert '_recent_pos_canonical_ids_for_raw_ean' in active_guard
          assert '_upc_id_identity_ready' in active_guard
          assert 'mapped_by_relinked_pos_upc_id_count' in active_guard
          relink_src=inspect.getsource(coverage_backfill.relink_pos_backfill)
          assert '_resolve_source_upc_id' in relink_src

          print('all-upc-lineage-smoke=PASS')
          PY


      - name: Validate Backoffice DOM collection bindings
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('backoffice_ui.py').read_text(encoding='utf-8')
          bad = re.findall(
              r"(?<!\$)\$\([^)]*\)\.(?:forEach|map|filter|find|some|every|reduce)\b",
              text,
          )
          assert not bad, f"Single-element $() used as collection: {bad}"
          print('backoffice-dom-bindings=PASS')
          PY

      - name: Validate Backoffice pricing and inventory contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('backoffice_runtime.py').read_text(encoding='utf-8')
          ui = Path('backoffice_ui.py').read_text(encoding='utf-8')
          assert 'QUICK_CHECK_CURRENT_AT_RESPONSE_TIME' in runtime
          assert 'upc_velocity_7d' in runtime
          assert 'vel7_oh_desc' in ui
          assert 'Highest 7D Velocity → Highest OH' in ui
          assert 'money(r.current_cost)' in ui
          assert 'FAMILY_251_252_ACTIVE' in runtime
          assert 'RECEIVING_AND_SAP_SELLING_ARTICLE' in runtime
          assert 'family_group_raw_movement_uom' in runtime
          assert 'Show inactive SAP Article' in ui
          assert 'PAIRED_SOURCE_317_318_NET_CONVERTED_OUT' in runtime
          assert 'family_conversion_317_318_7d' in runtime
          assert 'movement_by_article.get((fid, art), {})' in runtime
          assert 'SUM_LINKED_RECEIVING_ARTICLE_251_MINUS_252_WHEN_BASE_UOM_MATCHES' not in runtime

          # Article Manual/Table 1 owns operational hierarchy:
          # A=Family/Main, B=Selling Article, D=UPC, Main-row G=Family Selling UOM.
          # 317/318 and 309 are lineage/conversion only, never added as sold usage.
          assert 'ARTICLE_MANUAL_COLUMN_B_TO_D_EXACT' in runtime
          assert "JSON_EXTRACT(detail_json,'$.article')" in runtime
          assert 'SUM_UNIQUE_TABLE1_SELLING_ARTICLE_251_MINUS_252_FOR_7D_POS_ACTIVE_UPCS' in runtime
          assert 'READY_SELLING_ARTICLE_SUM_RECONCILED' in runtime
          assert 'ARTICLE_MANUAL_MAIN_ROW_COLUMN_G' in runtime
          assert 'HOLD_SELLING_ARTICLE_MVT_UOM_NOT_MAIN_SELLING_UOM' in runtime
          assert '7D FAMILY MVT' in ui
          assert 'RECONCILED' in ui
          assert 'Family Selling UOM' in ui
          assert '317/318 CONVERSION LINEAGE' in ui
          assert "Column B blank" in runtime
          assert "raw_table_name='raw_article_manual'" in runtime
          assert "out.setdefault((fid, key), main)" in runtime
          print('backoffice-pricing-inventory-contract=PASS')
          PY


      - name: Validate 4816 EA authority
        run: |
          python - <<'PY'
          from decimal import Decimal
          import manual_overrides as m

          rows=[x for x in m.SEED_OVERRIDES if str(x.get('ean_upc'))=='4816']
          assert len(rows)==1, rows
          row=rows[0]
          assert row['article_number']=='1351311'
          assert row['selling_uom_code']=='EA'
          assert row['base_uom_code']=='LB'
          assert Decimal(str(row['base_qty_per_selling_unit']))==Decimal('4')

          conv=[
              x for x in m.USER_CONFIRMED_COST_SELLING_CONVERSIONS_20260926
              if str(x.get('ean_upc'))=='4816'
          ]
          assert len(conv)==1, conv
          assert conv[0]['selling_uom_code']=='EA'
          assert Decimal(str(conv[0]['cost_qty']))==Decimal('4')
          assert conv[0]['cost_uom_code']=='LB'
          print('upc-4816-ea-authority=PASS')
          PY

      - name: Validate current price authority contract
        run: |
          python - <<'PY'
          import inspect
          import phase3

          src = inspect.getsource(phase3._current_price)
          assert "s.temporal_grain='SINGLE_DATE'" in src, src
          assert "s.period_start_date=s.period_end_date" in src, src
          assert "POS_SINGLE_DATE" in src, src
          assert "POS_SOLD_AVG" not in src, src
          assert "source_since_date<=%s" in src, src
          assert "business_today()" in src, src
          assert "source_since_date<=DATE(p.snapshot_at)" not in src, src
          print('current-price-authority=PASS')
          PY

      - name: Validate all current-price display surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          backoffice = Path('backoffice_runtime.py').read_text(encoding='utf-8')
          v2 = Path('webapp_v2_runtime.py').read_text(encoding='utf-8')
          ui = Path('backoffice_ui.py').read_text(encoding='utf-8')

          assert 'row.get("current_price")' in backoffice
          assert 'QUICK_CHECK_CURRENT_AT_RESPONSE_TIME' in backoffice
          assert '"current_price":row.get("current_price")' in v2
          assert '"current_price_source":row.get("current_price_source")' in v2
          assert 'Report-Day Avg Sold Price' in ui
          assert 'Current Price' in ui
          assert 'POS_SINGLE_DATE' in ui or 'current_price_source' in ui
          print('all-current-price-surfaces=PASS')
          PY

      - name: Validate Pricing Overview OH DOH and Company range rules
        run: |
          python - <<'PY'
          import inspect
          import phase3
          import webapp_v2_runtime as w
          from pathlib import Path

          src = inspect.getsource(w._gp_day_price_suggestion_from_batch)
          perf = inspect.getsource(w.performance_report)
          p3 = inspect.getsource(phase3.rebuild_quick_check)
          ui = Path('webapp_v2_ui.py').read_text(encoding='utf-8')
          backoffice_ui = Path('backoffice_ui.py').read_text(encoding='utf-8')

          assert 'supported_day_limit=14' in src
          assert 'company_price_a' in src and 'company_price_b' in src and 'company_price_c' in src
          assert 'COMPANY_RANGE_14D_MAX_GP_PER_DAY' in src
          assert 'COMPANY_RANGE_CLAMPED_14D_MAX_GP_PER_DAY' in src
          assert '14D_MAX_GP_PER_DAY' in src
          assert 'FRESH_DOH_GT_7' in src
          assert 'FROZEN_DOH_GT_60' in src
          assert "pclass in {'FRESH', 'LIVE', 'FROZEN'}" in p3
          assert 'current_oh' in perf and 'has_oh' in perf
          assert 'q14' in perf
          assert 'primary_reason_text' in perf
          assert 'company_range_low' in perf and 'company_range_high' in perf
          assert 'WEBAPP_V2_PERFORMANCE_V11' in perf

          assert "Current Price" in backoffice_ui
          assert "current_price_source" in backoffice_ui
          assert "Current Price" in ui
          assert "price_source" in ui and "price_as_of" in ui
          print('pricing-overview-v225=PASS')
          PY

      - name: Validate final Pricing Review rules
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('webapp_v2_runtime.py').read_text(encoding='utf-8')
          backoffice = Path('backoffice_ui.py').read_text(encoding='utf-8')
          v2ui = Path('webapp_v2_ui.py').read_text(encoding='utf-8')
          assert 'pclass=="FRESH"' in runtime
          assert 'doh_for_gate>Decimal("7")' in runtime
          assert 'pclass=="FROZEN"' in runtime
          assert 'doh_for_gate>Decimal("60")' in runtime
          assert 'has_oh=bool(current_oh is not None and current_oh>0)' in runtime
          assert 'history_gate=bool(q14>0)' in runtime
          assert 'company_low<=_d(x.get("price"))<=company_high' in runtime
          assert 'COMPANY_RANGE_CLAMPED_14D_MAX_GP_PER_DAY' in runtime
          assert 'current_price_source' in backoffice
          assert 'current_price_source' in v2ui
          print('final-pricing-review-rules=PASS')
          PY

      - name: Import worker and Phase 3 modules
        env:
          FULLMYSQL_WORK_TOKEN: smoke-token
        run: python -c "import worker, phase3, active_28d_uom_repair, current_active_cost_repair, uom_evidence_diagnostic; print('imports-ok')"

      - name: Live 240816 production diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://seal-app-tkkkd.ondigitalocean.app/healthz
          echo
          curl -fsS --max-time 90 "https://seal-app-tkkkd.ondigitalocean.app/v1/backoffice/inventory?category=ALL&limit=50&q=240816&lightweight=true"
          echo

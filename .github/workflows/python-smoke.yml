      - name: Live global Selling Article mapping audit
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 30 "$base/healthz" -o /tmp/health.json
          curl -fsS --max-time 120 "$base/v1/backoffice/inventory?category=ALL&limit=500&lightweight=true" -o /tmp/all.json
          python - <<'PY'
          import json,re
          from version import VERSION
          health=json.load(open('/tmp/health.json'))
          payload=json.load(open('/tmp/all.json'))
          rows=payload.get('rows') or []
          mismatches=[]
          review_249_fallbacks=[]
          fallback_rows=0
          exact_rows=0

          def desc_for(row,article):
              if not article:
                  return ''
              if str(article)==str(row.get('family_source_article') or ''):
                  return str(row.get('family_name') or row.get('name') or '')
              for a in row.get('receiving_articles') or []:
                  if str(a.get('article_number') or '')==str(article):
                      return str(a.get('article_description') or '')
              return ''

          for row in rows:
              digits=''.join(ch for ch in str(row.get('upc') or '') if ch.isdigit()).lstrip('0')
              if len(digits)<3:
                  continue
              prefix=digits[:3]
              if prefix not in {'240','245','249'}:
                  continue
              art=str(row.get('receiving_article') or '')
              basis=str(row.get('receiving_article_mapping_basis') or '')
              if basis=='ARTICLE_MANUAL_COLUMN_B_TO_D_EXACT':
                  exact_rows+=1
                  continue
              fallback_rows+=1
              desc=desc_for(row,art).upper()
              service=('SERVICE' in desc)
              bad=False
              reason=[]
              if prefix=='240' and (art.startswith('1545') or art.startswith('1549')):
                  bad=True; reason.append('240_TO_WRONG_STRUCTURAL_CHANNEL')
              if prefix=='245' and (art.startswith('1540') or art.startswith('1549')):
                  bad=True; reason.append('245_TO_WRONG_STRUCTURAL_CHANNEL')
              if prefix in {'240','245'} and service:
                  bad=True; reason.append('REGULAR_UPC_TO_SERVICE_ARTICLE')
              if prefix=='249' and basis!='ARTICLE_MANUAL_COLUMN_B_TO_D_EXACT':
                  review_249_fallbacks.append({
                      'family_article':row.get('family_article'),
                      'upc':row.get('upc'),
                      'assigned_article':art,
                      'basis':basis,
                  })
              if bad:
                  mismatches.append({
                      'family_article':row.get('family_article'),
                      'upc':row.get('upc'),
                      'name':row.get('name'),
                      'assigned_article':art,
                      'assigned_description':desc,
                      'basis':basis,
                      'reason':reason,
                  })

          by_upc={str(r.get('upc') or ''):r for r in rows}
          regression={}
          for target in ('24073900000','24518400000'):
              r=by_upc.get(target)
              regression[target]=None if r is None else {
                  'family_article':r.get('family_article'),
                  'assigned_article':r.get('receiving_article'),
                  'basis':r.get('receiving_article_mapping_basis'),
                  'qty_7d':r.get('qty_7d'),
              }

          out={
              'production_version':health.get('version'),
              'expected_version':VERSION,
              'rows_scanned':len(rows),
              'exact_rows':exact_rows,
              'fallback_rows':fallback_rows,
              'mismatch_count':len(mismatches),
              'mismatches':mismatches[:100],
              '249_fallback_review_count':len(review_249_fallbacks),
              'regression_targets':regression,
          }
          print(json.dumps(out,indent=2,default=str))
          if health.get('version')==VERSION:
              if mismatches:
                  raise SystemExit('GLOBAL_SELLING_ARTICLE_MAPPING_AUDIT_FAILED')
              saba=regression.get('24073900000')
              if saba and str(saba.get('assigned_article') or '')!='1341297':
                  raise SystemExit('REGRESSION_240739_NOT_MAPPED_TO_FAMILY_SELLING_ARTICLE')
              roe=regression.get('24518400000')
              if roe and not str(roe.get('assigned_article') or ''):
                  raise SystemExit('REGRESSION_245184_WAS_OVERBLOCKED')
          PY


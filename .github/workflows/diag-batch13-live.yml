name: Check POS sales freshness

on:
  push:
    branches:
      - diag/batch13-live-20260928

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production POS freshness
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"

          echo "=== HEALTH ==="
          curl -fsS --max-time 20 "$base/healthz"
          echo

          echo "=== CALENDAR ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/calendar?days=14"
          echo

          echo "=== RECENT BATCHES ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/recent?limit=12"
          echo

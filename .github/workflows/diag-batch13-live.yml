name: Inspect UOM and cost hold Quick Check rows

on:
  push:
    branches:
      - diag/batch13-live-20260928

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read hold rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base="https://seal-app-tkkkd.ondigitalocean.app"
          groups={
            "SELLING_UOM_MISSING": ["4711061630780","471351093053","654156851865","654156918025","695892380546","695892380548","6970206320964","7004121200","702868696387","75339325301","75339325329","81009389133","82994409246","87866500194","878665005568"],
            "CURRENT_COST_MISSING": ["24513600000","24576100000"],
            "COST_CONVERSION_SAMPLE": ["24503200000","4029549308","4029549384","4029550430","4029550566","4029550744","4029550918","4029550932","4029551059","4714163666558","66718100001","75339302070","823180600","8231806001","84323700815","85903390602"]
          }
          for label,upcs in groups.items():
              print("===",label,"===")
              for upc in upcs:
                  try:
                      with urllib.request.urlopen(base+"/v1/app/quick-check/"+upc,timeout=20) as r:
                          p=json.load(r)
                      item=p.get("item") or p
                      keep={k:item.get(k) for k in [
                          "ean_upc","article_number","main_article_number","family_id",
                          "selling_description","article_description","selling_uom","base_uom",
                          "base_qty_per_selling_unit","current_cost","current_cost_uom",
                          "cost_source","cost_date","quick_check_status","blocking_reason",
                          "current_price","pos_qty_7d","pos_qty_28d"
                      ]}
                      print(json.dumps(keep,ensure_ascii=False))
                  except Exception as e:
                      print(json.dumps({"ean_upc":upc,"error":repr(e)}))
          PY

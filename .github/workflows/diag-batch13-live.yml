name: Diagnose current FULL MYSQL batch

on:
  push:
    branches:
      - diag/batch13-live-20260928

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production current batch status
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"

          echo "=== HEALTH ==="
          curl -fsS --max-time 20 "$base/healthz"
          echo

          echo "=== ACTIVE/LATEST ==="
          curl -fsS --max-time 20 "$base/v1/web-upload/active" -o /tmp/active.json
          cat /tmp/active.json
          echo

          session="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/active.json', encoding='utf-8'))
          row=p.get('active_batch') or p.get('latest_batch') or {}
          print(row.get('batch_key') or '')
          PY
          )"

          if [ -z "$session" ]; then
            echo "NO_BATCH_SESSION"
            exit 0
          fi

          echo "=== SESSION STATUS ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/batches/$session" -o /tmp/status.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/status.json', encoding='utf-8'))
          print(json.dumps({
              'batch': p.get('batch'),
              'phase2c': p.get('phase2c'),
              'phase3': p.get('phase3'),
              'authoritative_status': p.get('authoritative_status'),
              'api_runs': p.get('api_runs'),
              'files': p.get('files'),
          }, indent=2, default=str))
          PY

          echo "=== RECENT ==="
          curl -sS --max-time 30 "$base/v1/web-upload/recent?limit=12"
          echo

          echo "=== BATCH 14 QA ==="
          curl -sS --max-time 30 -w "\nHTTP_STATUS=%{http_code}\n" "$base/v1/web-upload/batches/14/qa-summary"

          echo "=== QA DETAIL ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/batches/13/qa-summary"
          echo

          echo "=== COVERAGE DIAGNOSTIC ==="
          curl -sS --max-time 30 -w "\nHTTP_STATUS=%{http_code}\n" "$base/v1/diagnostics/coverage-backfill?batch_id=13"
          echo

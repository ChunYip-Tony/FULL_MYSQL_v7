name: Check current QA holds

on:
  push:
    branches:
      - diag/batch13-live-20260928

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current Batch 13 QA summary
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          echo "=== HEALTH ==="
          curl -fsS --max-time 20 "$base/healthz"
          echo
          echo "=== QA ==="
          curl -fsS --max-time 30 "$base/v1/web-upload/batches/13/qa-summary"
          echo

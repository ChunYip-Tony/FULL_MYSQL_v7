name: App Ready source recovery
on:
  push:
    paths:
      - 'server/yipman_app_ready_*.py'
      - 'server/test_app_ready_*.py'
      - '.github/workflows/app-ready-source-recovery.yml'
  pull_request:
    paths:
      - 'server/yipman_app_ready_*.py'
      - 'server/test_app_ready_*.py'
      - '.github/workflows/app-ready-source-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publication recovery
        working-directory: server
        run: python -m unittest test_app_ready_source_recovery -v
      - name: Check startup integration syntax
        working-directory: server
        run: python -m py_compile yipman_app_ready_api.py yipman_app_ready_recovery.py test_app_ready_startup_liveness.py

name: Finder department MySQL candidate
on:
  pull_request:
    paths:
      - 'server/finder_department_*'
      - 'server/Dockerfile.finder'
      - 'server/requirements.finder.txt'
      - 'server/finder_mysql_client.mjs'
      - 'server/ai_catalog_research.py'
      - 'server/ai_price_history.py'
      - 'server/test_finder_*'
      - '.github/workflows/finder-department-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the independent deployment image
        run: docker build -f server/Dockerfile.finder -t finder-department-ci server
      - name: Verify isolated startup and fail-closed readiness
        run: |
          docker run -d --name finder-department-ci --memory=256m --cpus=1 --read-only --tmpfs /tmp -p 127.0.0.1:18080:8080 finder-department-ci
          trap 'docker logs finder-department-ci; docker rm -f finder-department-ci >/dev/null' EXIT
          python - <<'PY'
          import json,time
          from http.client import HTTPException
          from urllib.error import HTTPError,URLError
          from urllib.request import urlopen
          root='http://127.0.0.1:18080'
          for attempt in range(30):
              try:
                  with urlopen(root+'/healthz',timeout=2) as response:
                      assert json.load(response)['status']=='alive'
                  break
              except (OSError,HTTPException):
                  time.sleep(0.5)
          else:
              raise AssertionError('Standalone service did not start')
          for path in ('/readyz','/v1/departments/meat/state'):
              try:
                  urlopen(root+path,timeout=3)
              except HTTPError as error:
                  assert error.code==503, (path,error.code)
              else:
                  raise AssertionError('Unconfigured service incorrectly accepted '+path)
          print('Independent image starts without Seafood credentials; unconfigured database routes remain unavailable.')
          PY
  contracts-and-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: finder_test_ci
          MYSQL_USER: finder_test
          MYSQL_PASSWORD: disposable-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: python -m pip install 'fastapi>=0.116,<1' 'httpx>=0.28,<1' 'mysql-connector-python>=9.5,<10'
      - name: API contracts
        run: python -m unittest -v test_finder_department_store test_finder_department_readiness
      - name: Server-side Site adapter contracts
        run: node --test test_finder_mysql_client.mjs
      - name: Real MySQL schema, atomic writes, rollback and views
        env:
          FINDER_TEST_MYSQL_HOST: 127.0.0.1
          FINDER_TEST_MYSQL_PORT: '3306'
          FINDER_TEST_MYSQL_DATABASE: finder_test_ci
          FINDER_TEST_MYSQL_USER: finder_test
          FINDER_TEST_MYSQL_PASSWORD: disposable-ci-only
        run: python -m unittest -v test_finder_department_mysql

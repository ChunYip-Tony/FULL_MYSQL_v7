name: Observe 249 POS source evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  observe:
    if: >-
      startsWith(github.event.pull_request.title, 'diag: 249 POS source evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://seal-app-tkkkd.ondigitalocean.app/healthz
          echo
      - name: 249528 actual raw POS evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 'https://seal-app-tkkkd.ondigitalocean.app/v1/web-upload/diagnostics/249-source-evidence?upc=24952800000'
          echo
      - name: Current lineage audit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 'https://seal-app-tkkkd.ondigitalocean.app/v1/backoffice/lineage-audit'
          echo
      - name: Current 249528 serving state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 'https://seal-app-tkkkd.ondigitalocean.app/v1/backoffice/inventory?category=ALL&limit=30&q=249528&lightweight=false'
          echo

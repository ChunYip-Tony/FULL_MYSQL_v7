name: One-time v7.0.299 hybrid 249 POS reconcile

on:
  push:
    branches: [main]

jobs:
  reconcile:
    if: startsWith(github.event.head_commit.message, 'ops: reconcile hybrid 249 POS v299')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for deployed v7.0.299 or newer
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          for i in $(seq 1 180); do
            body="$(curl -fsS --max-time 20 "$base/healthz" || true)"
            echo "$body"
            pass="$(BODY="$body" python - <<'PY'
          import json, os, re
          try:
              p=json.loads(os.environ.get('BODY') or '{}')
          except Exception:
              p={}
          def patch(v):
              m=re.search(r'7\.0\.(\d+)',str(v or ''))
              return int(m.group(1)) if m else -1
          ok=(
              p.get('ok') is True
              and patch(p.get('version')) >= 299
              and patch(p.get('worker_version')) >= 299
              and p.get('worker_healthy') is True
              and p.get('worker_ready') is True
          )
          print('1' if ok else '0')
          PY
          )"
            if [ "$pass" = "1" ]; then
              echo "DEPLOY_VERSION_GATE=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "DEPLOY_VERSION_GATE=TIMEOUT"
          exit 1

      - name: Wait until upload pipeline is idle
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          for i in $(seq 1 180); do
            curl -fsS --max-time 30 "$base/v1/web-upload/active" -o /tmp/active.json
            cat /tmp/active.json
            echo
            active="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/active.json',encoding='utf-8'))
          print('1' if p.get('active_batch') else '0')
          PY
          )"
            if [ "$active" = "0" ]; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Resolve latest rebuildable batch
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 30 "$base/v1/web-upload/recent?limit=30" -o /tmp/recent.json
          batch_id="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/recent.json',encoding='utf-8'))
          allowed={'QUICK_CHECK_READY','QUICK_CHECK_READY_WITH_HOLDS','COMPLETED','READY','PHASE3_QA_HOLD'}
          row=next((x for x in (p.get('batches') or [])
                    if str(x.get('phase3_status') or '').upper() in allowed
                    or str(x.get('processing_status') or '').upper() in allowed),None)
          if not row:
              raise SystemExit('NO_REBUILDABLE_BATCH_AVAILABLE')
          print(int(row['batch_id']))
          PY
          )"
          echo "BATCH_ID=$batch_id" >> "$GITHUB_ENV"

      - name: Start Phase 3 rebuild
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          for i in $(seq 1 90); do
            set +e
            code="$(curl -sS --max-time 60 -o /tmp/rebuild.json -w '%{http_code}' -X POST "$base/v1/web-upload/batches/$BATCH_ID/rebuild-phase3")"
            rc=$?
            set -e
            test ! -s /tmp/rebuild.json || cat /tmp/rebuild.json
            if [ "$rc" = "0" ] && [ "$code" = "200" ]; then
              read -r ok run_id session_id < <(python - <<'PY'
          import json,re
          p=json.load(open('/tmp/rebuild.json',encoding='utf-8'))
          def patch(v):
              m=re.search(r'7\.0\.(\d+)',str(v or ''))
              return int(m.group(1)) if m else -1
          ok=p.get('version_fence_pass') is True and patch(p.get('code_version'))>=299
          print('1' if ok else '0',p.get('pipeline_run_id') or '',p.get('session_id') or '')
          PY
          )
              if [ "$ok" = "1" ] && [ -n "$run_id" ] && [ -n "$session_id" ]; then
                echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
                echo "SESSION_ID=$session_id" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Wait for rebuild completion
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          for i in $(seq 1 240); do
            curl -fsS --max-time 30 "$base/v1/web-upload/batches/$SESSION_ID" -o /tmp/session.json
            state="$(RUN_ID="$RUN_ID" python - <<'PY'
          import json,os
          rid=int(os.environ['RUN_ID'])
          p=json.load(open('/tmp/session.json',encoding='utf-8'))
          run=next((r for r in (p.get('api_runs') or []) if int(r.get('pipeline_run_id') or 0)==rid),None)
          print('MISSING' if not run else str(run.get('processing_status') or ''))
          PY
          )"
            echo "$state"
            case "$state" in
              COMPLETED) exit 0 ;;
              QA_HOLD|FAILED|FAILED_QA|ABORTED|PAUSED) cat /tmp/session.json; exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      - name: Verify global POS lineage
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 120 "$base/v1/backoffice/lineage-audit" -o /tmp/audit.json
          cat /tmp/audit.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/audit.json',encoding='utf-8'))
          if p.get('pass') is not True:
              raise SystemExit('GLOBAL_POS_LINEAGE_AUDIT_FAILED')
          print('GLOBAL_POS_LINEAGE_AUDIT=PASS')
          PY

      - name: Verify 249580 current sales
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 90 "$base/v1/backoffice/inventory?category=ALL&limit=50&q=249580&lightweight=false" -o /tmp/q.json
          cat /tmp/q.json
          python - <<'PY'
          import json
          from decimal import Decimal
          p=json.load(open('/tmp/q.json',encoding='utf-8'))
          target=next((r for r in (p.get('rows') or [])
                       if ''.join(ch for ch in str(r.get('upc') or '') if ch.isdigit()).lstrip('0')=='24958000000'),None)
          if not target:
              raise SystemExit('UPC_249580_NOT_RETURNED')
          qty=Decimal(str(target.get('qty_7d') or 0))
          print('UPC_249580_QTY_7D='+str(qty))
          if qty <= 0:
              raise SystemExit('UPC_249580_STILL_ZERO')
          print('UPC_249580_POS=PASS')
          PY

name: Finder approved hosting rollout
on:
  pull_request:
    paths:
      - 'server/digitalocean_finder_rollout.py'
      - 'server/test_digitalocean_finder_rollout.py'
      - 'server/finder_department_service.py'
      - 'server/finder_department_stage.py'
      - 'server/finder_department_schema_setup.py'
      - '.github/workflows/digitalocean-finder-rollout.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Owner-approved plan: Seafood $10/month; department service $5/month; temporary schema job under $1'
        required: true
        type: choice
        default: inspect
        options: [inspect, resize, provision, provision-public-git, stage-service, finalize]
      public_key:
        description: 'Provision only: RSA-4096 public key (base64 DER). Never enter a private key or token.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: finder-approved-hosting-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=44,<47' 'fastapi>=0.116,<1' 'httpx>=0.28,<1'
      - working-directory: server
        run: python -m unittest test_digitalocean_finder_rollout test_digitalocean_health_policy test_digitalocean_preflight -v
  manage:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=44,<47'
      - name: Apply only the approved deployment stage
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          FINDER_PUBLIC_KEY_DER_BASE64: ${{ inputs.public_key }}
          FINDER_ROLLOUT_ACTION: ${{ inputs.action }}
        run: python server/digitalocean_finder_rollout.py "$FINDER_ROLLOUT_ACTION"

name: One-time Batch 13 ChatGPT republish

on:
  push:
    branches:
      - main

jobs:
  republish:
    if: github.event.head_commit.message == 'Trigger Batch 13 ChatGPT republish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for API and worker v7.0.190 deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          consecutive=0
          for i in $(seq 1 120); do
            body="$(curl -fsS --max-time 15 "$base/healthz" || true)"
            echo "$body"
            pass="$(BODY="$body" python - <<'PY'
          import json, os
          try:
              p=json.loads(os.environ.get('BODY') or '{}')
          except Exception:
              p={}
          ok=(
              p.get('ok') is True
              and p.get('version') == '7.0.190-single-service'
              and p.get('worker_version') == '7.0.190-single-service'
              and p.get('worker_healthy') is True
              and p.get('worker_ready') is True
          )
          print('1' if ok else '0')
          PY
          )"
            if [ "$pass" = "1" ]; then
              consecutive=$((consecutive+1))
              if [ "$consecutive" -ge 3 ]; then
                echo "API_WORKER_VERSION_GATE=PASS"
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 5
          done
          echo "API_WORKER_VERSION_GATE=TIMEOUT"
          exit 1

      - name: Decide whether Batch 13 needs another Phase 3 rebuild
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 30 "$base/v1/web-upload/batches/13/qa-summary" -o /tmp/pre-qa.json
          cat /tmp/pre-qa.json
          echo
          need="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/pre-qa.json', encoding='utf-8'))
          p3=p.get('phase3') or {}
          guard=p.get('current_active_unmapped_guard') or {}
          ready=(
              str(p3.get('result_status') or '').upper() in {'QUICK_CHECK_READY','QUICK_CHECK_READY_WITH_HOLDS'}
              and int(p3.get('blocking_issue_count') or 0) == 0
              and int(guard.get('active_unmapped_count') or 0) == 0
          )
          print('0' if ready else '1')
          PY
          )"
          echo "NEED_REBUILD=$need" | tee -a "$GITHUB_ENV"
          if [ "$need" = "0" ]; then
            echo "BATCH13_ALREADY_PUBLISHABLE=PASS"
          fi

      - name: Rebuild Batch 13 Phase 3 with version-fenced worker
        if: ${{ env.NEED_REBUILD == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          accepted=0
          run_id=""
          session_id=""

          for i in $(seq 1 120); do
            set +e
            http_code="$(curl -sS --max-time 60 -o /tmp/rebuild.json -w '%{http_code}' \
              -X POST "$base/v1/web-upload/batches/13/rebuild-phase3")"
            curl_rc=$?
            set -e

            echo "REBUILD_ATTEMPT=$i CURL_RC=$curl_rc HTTP_STATUS=$http_code"
            if [ -s /tmp/rebuild.json ]; then
              cat /tmp/rebuild.json
              echo
            fi

            if [ "$curl_rc" = "0" ] && [ "$http_code" = "200" ]; then
              read -r version_ok run_id session_id < <(python - <<'PY'
          import json
          p=json.load(open('/tmp/rebuild.json', encoding='utf-8'))
          version_ok='1' if p.get('code_version') == '7.0.190-single-service' and p.get('version_fence_pass') is True else '0'
          print(version_ok, p.get('pipeline_run_id') or '', p.get('session_id') or '')
          PY
          )
              if [ "$version_ok" = "1" ] && [ -n "$run_id" ] && [ -n "$session_id" ]; then
                accepted=1
                break
              fi
            fi

            if [ "$http_code" = "409" ]; then
              reason="$(python - <<'PY'
          import json
          try:
              p=json.load(open('/tmp/rebuild.json', encoding='utf-8'))
          except Exception:
              p={}
          d=p.get('detail') or {}
          print(d.get('reason') or '')
          PY
          )"
              echo "REBUILD_BLOCK_REASON=$reason"
              if [ "$reason" = "ACTIVE_RUN_VERSION_MISMATCH" ]; then
                sleep 5
                continue
              fi
            fi
            sleep 5
          done

          if [ "$accepted" != "1" ]; then
            echo "VERSION_FENCED_REBUILD_NOT_ACCEPTED"
            exit 1
          fi

          echo "VERSION_FENCED_RUN_ID=$run_id"
          echo "SESSION_ID=$session_id"

          terminal=0
          for i in $(seq 1 180); do
            curl -fsS --max-time 30 "$base/v1/web-upload/batches/$session_id" -o /tmp/session.json
            state="$(RUN_ID="$run_id" python - <<'PY'
          import json, os
          rid=int(os.environ['RUN_ID'])
          p=json.load(open('/tmp/session.json', encoding='utf-8'))
          run=next((r for r in (p.get('api_runs') or []) if int(r.get('pipeline_run_id') or 0)==rid), None)
          if not run:
              print('MISSING||')
          else:
              print(str(run.get('processing_status') or '')+'|'+str(run.get('code_version') or '')+'|'+str(run.get('phase3_stage') or run.get('last_phase3_stage') or ''))
          PY
          )"
            echo "$state"
            status="${state%%|*}"
            rest="${state#*|}"
            code_version="${rest%%|*}"

            if [ "$code_version" != "7.0.190-single-service" ] && [ "$status" != "MISSING" ]; then
              echo "RUN_VERSION_FENCE_BROKEN=$state"
              exit 1
            fi

            case "$status" in
              COMPLETED|QA_HOLD|FAILED|FAILED_QA|ABORTED|PAUSED)
                terminal=1
                break
                ;;
            esac
            sleep 5
          done

          if [ "$terminal" != "1" ]; then
            echo "VERSION_FENCED_RUN_DID_NOT_REACH_TERMINAL_STATE"
            exit 1
          fi
          if [ "$status" != "COMPLETED" ]; then
            echo "VERSION_FENCED_RUN_NOT_COMPLETED=$state"
            exit 1
          fi

      - name: Verify Batch 13 QA is publishable
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 30 "$base/v1/web-upload/batches/13/qa-summary" -o /tmp/qa-summary.json
          cat /tmp/qa-summary.json
          echo
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qa-summary.json', encoding='utf-8'))
          p3=p.get('phase3') or {}
          guard=p.get('current_active_unmapped_guard') or {}
          assert str(p3.get('result_status') or '').upper() in {'QUICK_CHECK_READY','QUICK_CHECK_READY_WITH_HOLDS'}, p3
          assert int(p3.get('blocking_issue_count') or 0) == 0, p3
          assert int(guard.get('active_unmapped_count') or 0) == 0, guard
          print('BATCH13_QA=PASS')
          PY

      - name: Verify 249450 fried/service Quick Check sales
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 60 "$base/v1/app/quick-check/24945000000" -o /tmp/qc-249450.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qc-249450.json', encoding='utf-8'))
          item=p.get('item') or p
          related=p.get('related_upcs') or []
          target={
              'ean_upc': item.get('ean_upc'),
              'selling_description': item.get('selling_description'),
              'pos_qty_7d': item.get('pos_qty_7d'),
              'pos_qty_28d': item.get('pos_qty_28d'),
              'pos_qty_30d': item.get('pos_qty_30d'),
              'current_price': item.get('current_price'),
              'quick_check_status': item.get('quick_check_status'),
              'data_through': item.get('pos_data_through') or item.get('sales_data_through'),
          }
          print(json.dumps(target, indent=2))
          print('RELATED_249450_ROWS=')
          print(json.dumps([r for r in related if str(r.get('ean_upc') or '') == '24945000000'], indent=2))
          if str(target.get('ean_upc') or '') != '24945000000':
              raise SystemExit('Quick Check response did not resolve 24945000000')
          qty=target.get('pos_qty_7d')
          if qty is None:
              raise SystemExit('249450 pos_qty_7d is missing')
          if float(qty) == 0:
              raise SystemExit('249450 pos_qty_7d is still zero after v7.0.190 serving validation')
          PY

      - name: Queue ChatGPT Sheet publish asynchronously
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          http_code="$(curl -sS --max-time 30 \
            -o /tmp/republish.json \
            -w '%{http_code}' \
            -X POST "$base/v1/web-upload/batches/13/republish-chatgpt-analysis")"
          cat /tmp/republish.json
          echo
          echo "HTTP_STATUS=$http_code"
          test "$http_code" = "200"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/republish.json', encoding='utf-8'))
          assert p.get('status') in {'QUEUED','ALREADY_QUEUED','ALREADY_ACTIVE'}, p
          assert int(p.get('batch_id') or 0) == 13, p
          assert p.get('async_nonblocking') is True, p
          assert p.get('quick_check_serving_unblocked') is True, p
          print('ASYNC_SHEET_PUBLISH_QUEUE=PASS')
          PY

      - name: Read async Sheet publish status without blocking Quick Check
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 30 "$base/v1/web-upload/batches/13/chatgpt-publish-status" | tee /tmp/publish-status.json
          echo
          python - <<'PY'
          import json
          p=json.load(open('/tmp/publish-status.json', encoding='utf-8'))
          assert p.get('status') in {'QUEUED','STARTED','COMPLETED','FAILED'}, p
          assert p.get('async_nonblocking') is True, p
          print('ASYNC_PUBLISH_STATUS_VISIBLE=PASS')
          PY

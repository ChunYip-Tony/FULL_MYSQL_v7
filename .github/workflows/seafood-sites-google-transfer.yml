name: Seafood Sites Google connection transfer
on:
  push:
    branches: ['codex/seafood-sites-google-transfer-20261026']
    paths: ['.github/workflows/seafood-sites-google-transfer.yml']
permissions:
  contents: read
  statuses: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/codex/seafood-sites-google-transfer-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'websocket-client==1.8.0'
      - name: Encrypt only the existing Seafood Google connection
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,time,urllib.request
          import websocket
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']
          def status(state,desc):
           data=json.dumps({'state':state,'context':'seafood-sites-google-transfer','description':desc,'target_url':'https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}).encode()
           request=urllib.request.Request('https://api.github.com/repos/'+repo+'/statuses/'+sha,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'})
           with urllib.request.urlopen(request,timeout=20) as r: r.read()
          status('pending','Reading existing Seafood Google configuration')
          phase='console-access'
          try:
           request=urllib.request.Request('https://api.digitalocean.com/v2/apps/05680b68-0372-479c-b2b6-bae286537e31/components/full-mysql-v7-server/exec',headers={'Authorization':'Bearer '+os.environ['DIGITALOCEAN_ACCESS_TOKEN']})
           with urllib.request.urlopen(request,timeout=30) as r: response=json.load(r)
           print('Console response fields:',','.join(sorted(response)))
           endpoint=response['url']
           if not endpoint.startswith('wss://'): raise ValueError('Invalid console endpoint')
           phase='websocket-open'
           ws=websocket.create_connection(endpoint,timeout=25)
           code="import os,json,base64\npub=base64.b64decode(\"\")\nnames=['FULLMYSQL_APPS_SCRIPT_WEB_APP_URL','FULLMYSQL_APPS_SCRIPT_WEBHOOK_SECRET']\nvalues={k:os.environ.get(k,'') for k in names}\nif any(not v for v in values.values()): raise SystemExit('NATIVE_TRANSFER_MISSING_CONFIG')\npayload=json.dumps(values,separators=(',',':')).encode()\ntry:\n from cryptography.hazmat.primitives import serialization,hashes\n from cryptography.hazmat.primitives.asymmetric import padding\n key=serialization.load_der_public_key(pub)\n encrypt=lambda b:key.encrypt(b,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))\n alg='RSA-OAEP-SHA256'\nexcept ImportError:\n import rsa\n key=rsa.PublicKey.load_pkcs1_openssl_der(pub)\n encrypt=lambda b:rsa.encrypt(b,key)\n alg='RSA-PKCS1-v1_5'\nencrypted={'algorithm':alg,'chunks':[base64.b64encode(encrypt(payload[n:n+190])).decode() for n in range(0,len(payload),190)]}\nprint('NATIVE_TRANSFER_V1:'+base64.b64encode(json.dumps(encrypted).encode()).decode(),flush=True)"
           command="python -c \"import base64;exec(base64.b64decode('"+base64.b64encode(code.encode()).decode()+"'))\"\n"
           phase='runtime-encryption'
           ws.send(json.dumps({'op':'stdin','data':command}))
           buf=''; deadline=time.time()+100; envelope=None
           while time.time()<deadline:
            msg=json.loads(ws.recv()); buf+=msg.get('data','')
            if 'NATIVE_TRANSFER_V1:' in buf:
             candidate=buf.split('NATIVE_TRANSFER_V1:',1)[1].splitlines()
             if candidate:
              try:
               raw=candidate[0].strip(); envelope=json.loads(base64.b64decode(raw))
               if envelope.get('algorithm') not in ('RSA-OAEP-SHA256','RSA-PKCS1-v1_5') or not envelope.get('chunks'): raise ValueError()
               break
              except (ValueError,KeyError): pass
            if 'NATIVE_TRANSFER_MISSING_CONFIG' in buf: raise ValueError('Missing config')
            if len(buf)>60000: raise ValueError('Unexpected console response')
           ws.close()
           if envelope is None: raise ValueError('No encrypted configuration returned')
           print('ENCRYPTED_TRANSFER:'+base64.b64encode(json.dumps(envelope).encode()).decode())
           status('success','Encrypted Seafood configuration transfer available')
          except Exception as error:
           print('Transfer diagnostic:',phase,type(error).__name__,getattr(error,'code',None))
           status('failure','Configuration transfer unavailable; no secrets printed')
           raise SystemExit('Configuration transfer failed; console URL and output withheld')
          PY

name: One-time v7.0.338 full-family receipt audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: startsWith(github.event.head_commit.message, 'v7.0.338:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for v7.0.338 API
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          ok=0
          for i in $(seq 1 240); do
            body="$(curl -fsS --max-time 15 "$base/healthz" || true)"
            echo "$body"
            ok="$(BODY="$body" python - <<'PY'
          import json,os
          try: p=json.loads(os.environ.get('BODY') or '{}')
          except Exception: p={}
          print('1' if p.get('ok') is True and p.get('version')=='7.0.338-single-service' else '0')
          PY
          )"
            [ "$ok" = 1 ] && break
            sleep 5
          done
          test "$ok" = 1
      - name: Audit every family for receipt double counting
        shell: bash
        run: |
          set -euo pipefail
          base="https://seal-app-tkkkd.ondigitalocean.app"
          curl -fsS --max-time 180 "$base/v1/yipman/receipt-audit?lookback_days=365" -o /tmp/audit.json
          python -m json.tool /tmp/audit.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/audit.json',encoding='utf-8'))
          assert p.get('current_physical_receipt_types')==['101','109'],p
          assert p.get('current_physical_reversal_types')==['102','110'],p
          assert p.get('cost_stage_types')==['107','108'],p
          assert int(p.get('families_with_receipt_evidence') or 0)>0,p
          print('AUDIT_STATUS',p.get('status'))
          print('FAMILIES_TOTAL',p.get('product_families_total'))
          print('FAMILIES_WITH_RECEIPTS',p.get('families_with_receipt_evidence'))
          print('LEGACY_107_109_EXPOSURE_FAMILIES',p.get('legacy_107_109_exposure_family_count'))
          print('PHYSICAL_DUPLICATE_CANDIDATES',p.get('physical_duplicate_candidate_count'))
          print('REVIEW_FAMILIES',[(x.get('family_article_number'),x.get('family_name'),x.get('physical_duplicate_candidate_count')) for x in p.get('families_with_physical_duplicate_candidates') or []])
          PY
